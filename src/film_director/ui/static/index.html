<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Film Director — Operator Console</title>
<style>
:root {
  --bg: #1a1a2e; --bg2: #16213e; --bg3: #0f3460; --bg4: #1e1e3a;
  --text: #e0e0e0; --text2: #8890a8; --accent: #e94560;
  --green: #4ecca3; --yellow: #f0c040; --red: #e94560;
  --blue: #4ea8de; --border: #2a2a4a; --border2: #3a3a5a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; }
.app { display: grid; grid-template-columns: 260px 1fr 340px; height: 100vh; }

/* SIDEBAR */
.sidebar { background: var(--bg2); border-right: 1px solid var(--border); overflow-y: auto; }
.sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
.sidebar-header h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
.sidebar-header .sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
.shot-list { list-style: none; padding: 8px; }
.shot-card {
  padding: 10px 12px; margin-bottom: 4px; border-radius: 6px; cursor: pointer;
  border: 1px solid transparent; transition: all 0.12s;
}
.shot-card:hover { background: rgba(255,255,255,0.04); }
.shot-card.selected { border-color: var(--accent); background: rgba(233,69,96,0.06); }
.shot-num { font-size: 11px; color: var(--text2); font-weight: 600; }
.shot-action { font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { display: inline-block; padding: 2px 7px; border-radius: 10px; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 3px; }
.badge-approved { background: rgba(78,204,163,0.15); color: var(--green); }
.badge-succeeded { background: rgba(78,168,222,0.15); color: var(--blue); }
.badge-pending { background: rgba(240,192,64,0.15); color: var(--yellow); }
.badge-rejected { background: rgba(233,69,96,0.15); color: var(--red); }
.badge-empty { background: rgba(255,255,255,0.04); color: var(--text2); }
.badge-blocked { background: rgba(233,69,96,0.1); color: var(--red); }
.badge-available { background: rgba(78,204,163,0.15); color: var(--green); }

/* MAIN */
.main { padding: 20px 24px; overflow-y: auto; }
.section { margin-bottom: 20px; }
.section-title { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.shot-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
.meta-row { display: flex; gap: 20px; margin-bottom: 12px; flex-wrap: wrap; }
.meta-item { }
.meta-label { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px; }
.meta-value { font-size: 13px; margin-top: 1px; }
.desc-box { background: var(--bg4); padding: 10px 12px; border-radius: 6px; font-size: 12px; line-height: 1.5; margin-bottom: 12px; max-height: 80px; overflow-y: auto; }
.prompt-box { background: #111828; padding: 12px 14px; border-radius: 6px; font-size: 12px; line-height: 1.6; font-family: 'Cascadia Code', 'Consolas', monospace; white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow-y: auto; border: 1px solid var(--border); }
.video-wrap { background: #000; border-radius: 8px; overflow: hidden; max-width: 720px; margin-bottom: 12px; }
.video-wrap video { width: 100%; display: block; }
.no-video { padding: 48px; text-align: center; color: var(--text2); }
.take-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 4px; background: var(--bg4); border-radius: 6px; }
.take-info { flex: 1; }
.take-num { font-weight: 700; font-size: 13px; }
.take-meta { font-size: 11px; color: var(--text2); }
.take-actions { display: flex; gap: 6px; }

/* RIGHT PANEL */
.panel { background: var(--bg2); border-left: 1px solid var(--border); overflow-y: auto; padding: 16px; }
.panel-section { margin-bottom: 16px; }
.panel-title { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 8px; }

.pic-card { display: flex; gap: 10px; align-items: flex-start; padding: 8px; margin-bottom: 6px; background: var(--bg4); border-radius: 6px; border: 1px solid var(--border); }
.pic-card img { width: 52px; height: 52px; object-fit: cover; border-radius: 4px; background: #111; }
.pic-card .pic-placeholder { width: 52px; height: 52px; border-radius: 4px; background: #222; display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--text2); }
.pic-info { flex: 1; min-width: 0; }
.pic-num { font-size: 10px; color: var(--text2); font-weight: 700; }
.pic-role { font-size: 12px; font-weight: 600; }
.pic-ref { font-size: 10px; color: var(--text2); margin-top: 1px; }

.blocked-msg { background: rgba(233,69,96,0.08); border: 1px solid rgba(233,69,96,0.2); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
.blocked-msg .msg { font-size: 12px; color: var(--red); margin-bottom: 6px; }

.settings-grid { display: grid; gap: 8px; }
.setting { }
.setting label { display: block; font-size: 10px; color: var(--text2); text-transform: uppercase; margin-bottom: 2px; }
.setting .val { font-size: 12px; padding: 5px 8px; background: rgba(255,255,255,0.03); border-radius: 4px; }
.setting input { width: 100%; padding: 5px 8px; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 12px; }

.gen-summary { background: var(--bg4); border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; font-size: 11px; line-height: 1.6; }
.gen-summary strong { color: var(--text); }

/* Buttons */
.btn { padding: 8px 16px; border: none; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; transition: opacity 0.12s; }
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-approve { background: var(--green); color: #111; }
.btn-reject { background: #c0392b; color: #fff; }
.btn-sm { padding: 5px 12px; font-size: 11px; }
.btn-link { background: none; border: none; color: var(--blue); cursor: pointer; font-size: 12px; text-decoration: underline; padding: 0; }
.btn-generate { width: 100%; padding: 12px; font-size: 14px; }
.action-bar { margin-top: 12px; }

.loading { text-align: center; padding: 32px; color: var(--text2); }
.toast { position: fixed; bottom: 20px; right: 20px; padding: 10px 18px; border-radius: 8px; font-size: 12px; font-weight: 600; z-index: 100; }
.toast-ok { background: var(--green); color: #111; }
.toast-err { background: var(--red); color: #fff; }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <h1>Film Director</h1>
      <div class="sub" id="project-sub">Loading...</div>
    </div>
    <ul class="shot-list" id="shot-list"></ul>
  </div>
  <div class="main" id="main-panel"><div class="loading">Select a shot</div></div>
  <div class="panel" id="panel"><div class="loading">Select a shot</div></div>
</div>

<script>
let currentProject = null, currentShots = [], selectedShotId = null, shotTakesCache = {};

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) { const e = await r.json().catch(() => ({error: r.statusText})); throw new Error(e.error || e.detail || r.statusText); }
  return r.json();
}
function toast(msg, ok=true) {
  const el = document.createElement('div');
  el.className = 'toast ' + (ok ? 'toast-ok' : 'toast-err');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3000);
}
function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

async function loadProject() {
  const projects = await api('/projects');
  if (!projects.length) return;
  currentProject = projects[0];
  document.getElementById('project-sub').textContent = currentProject.id;
  await loadShots();
}

async function loadShots() {
  if (!currentProject) return;
  const shots = await api(`/projects/${currentProject.id}/shots`);
  shots.sort((a, b) => a.order_index - b.order_index);
  currentShots = shots;
  shotTakesCache = {};
  for (const shot of shots) {
    try { shotTakesCache[shot.id] = await api(`/shots/${shot.id}/takes`); } catch(e) { shotTakesCache[shot.id] = []; }
  }
  renderShotList();
}

function renderShotList() {
  const list = document.getElementById('shot-list');
  list.innerHTML = '';
  for (const shot of currentShots) {
    const takes = shotTakesCache[shot.id] || [];
    const approved = takes.find(t => t.status === 'approved');
    const review = takes.find(t => t.status === 'succeeded');
    let badge = '<span class="badge badge-empty">No takes</span>';
    if (approved) badge = '<span class="badge badge-approved">Approved</span>';
    else if (review) badge = '<span class="badge badge-succeeded">Review</span>';
    else if (takes.length) badge = '<span class="badge badge-pending">Pending</span>';
    const li = document.createElement('li');
    li.className = 'shot-card' + (shot.id === selectedShotId ? ' selected' : '');
    li.innerHTML = `<div class="shot-num">Shot ${shot.order_index + 1}</div><div class="shot-action">${esc((shot.action||'').substring(0,55))}</div>${badge}`;
    li.onclick = () => selectShot(shot.id);
    list.appendChild(li);
  }
}

async function selectShot(shotId) {
  selectedShotId = shotId;
  renderShotList();
  const shot = currentShots.find(s => s.id === shotId);
  if (!shot) return;
  let preview = null;
  try { preview = await api(`/shots/${shotId}/generation-preview`); } catch(e) { console.warn('Preview failed:', e); }
  renderMain(shot, preview);
  renderPanel(shot, preview);
}

function renderMain(shot, preview) {
  const panel = document.getElementById('main-panel');
  const takes = shotTakesCache[shot.id] || [];
  const idx = currentShots.indexOf(shot);
  let cam = {};
  try { cam = typeof shot.camera === 'string' ? JSON.parse(shot.camera) : (shot.camera || {}); } catch(e) {}
  const approved = takes.find(t => t.status === 'approved');
  const review = takes.filter(t => t.status === 'succeeded');
  const showTake = approved || review[review.length - 1] || takes[takes.length - 1];
  let videoHtml = '<div class="no-video">No takes generated</div>';
  if (showTake && showTake.video_path) {
    const url = '/media/' + showTake.video_path.replace(/\\/g, '/');
    videoHtml = `<video controls autoplay loop muted><source src="${url}" type="video/mp4"></video>`;
  }
  const promptText = preview ? preview.prompt_text : '';

  panel.innerHTML = `
    <div class="shot-title">Shot ${idx + 1}</div>
    <div class="meta-row">
      <div class="meta-item"><div class="meta-label">Duration</div><div class="meta-value">${preview ? preview.duration_sec + 's → ' + preview.resolved_frames + ' frames (' + preview.resolved_duration_sec + 's)' : shot.duration_sec + 's'}</div></div>
      <div class="meta-item"><div class="meta-label">Camera</div><div class="meta-value">${esc(cam.shot_size||'')} ${esc(cam.movement||'')}</div></div>
      <div class="meta-item"><div class="meta-label">Workflow</div><div class="meta-value">${preview ? preview.workflow_id : ''}</div></div>
    </div>
    <div class="section">
      <div class="section-title">Shot Description</div>
      <div class="desc-box">${esc(shot.action || '')}</div>
    </div>
    ${promptText ? `<div class="section"><div class="section-title">Generation Prompt</div><div class="prompt-box">${esc(promptText)}</div></div>` : ''}
    <div class="section">
      <div class="section-title">Video</div>
      <div class="video-wrap">${videoHtml}</div>
    </div>
    <div class="section">
      <div class="section-title">Takes (${takes.length})</div>
      ${takes.length === 0 ? '<div style="color:var(--text2)">No takes yet</div>' : ''}
      ${takes.map(t => `
        <div class="take-row">
          <div class="take-info">
            <span class="take-num">Take</span>
            <span class="badge badge-${t.status}">${t.status}</span>
            <div class="take-meta">Seed: ${t.seed} · ${t.id.substring(0,12)}</div>
          </div>
          <div class="take-actions">
            ${t.status === 'succeeded' ? `
              <button class="btn btn-approve btn-sm" onclick="approveTake('${t.id}')">Approve</button>
              <button class="btn btn-reject btn-sm" onclick="rejectTake('${t.id}')">Reject</button>
            ` : ''}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderPanel(shot, preview) {
  const panel = document.getElementById('panel');
  if (!preview) { panel.innerHTML = '<div class="loading">Preview unavailable</div>'; return; }
  const idx = currentShots.indexOf(shot);

  let picsHtml = '';
  for (const pic of preview.pictures) {
    const hasImg = pic.thumbnail_url && pic.status !== 'blocked';
    picsHtml += `
      <div class="pic-card">
        ${hasImg ? `<img src="${pic.thumbnail_url}" alt="${pic.role}">` : `<div class="pic-placeholder">${pic.status === 'blocked' ? '⊘' : '?'}</div>`}
        <div class="pic-info">
          <div class="pic-num">Picture ${pic.picture_index}</div>
          <div class="pic-role">${pic.role}</div>
          <div class="pic-ref">${pic.reference_id ? pic.reference_id.substring(0,16) : (pic.source_label || '')}</div>
          <span class="badge badge-${pic.status}">${pic.status}</span>
        </div>
      </div>`;
  }

  let blockedHtml = '';
  if (preview.continuity_blocked) {
    const predIdx = preview.predecessor_shot_index;
    blockedHtml = `
      <div class="blocked-msg">
        <div class="msg">Shot ${idx + 1} is blocked because Shot ${predIdx + 1} has no approved Take.</div>
        <button class="btn-link" onclick="selectShot('${currentShots[predIdx].id}')">Open Shot ${predIdx + 1} for Review →</button>
      </div>`;
  }

  const canGen = preview.can_generate;

  panel.innerHTML = `
    <div class="panel-section">
      <div class="panel-title">Generation Inputs</div>
      ${picsHtml}
    </div>

    ${blockedHtml}

    <div class="panel-section">
      <div class="panel-title">Settings</div>
      <div class="settings-grid">
        <div class="setting"><label>Workflow</label><div class="val">${preview.workflow_id} v${preview.workflow_version}</div></div>
        <div class="setting"><label>Strategy</label><div class="val">${preview.strategy}</div></div>
        <div class="setting"><label>Duration</label><div class="val">${preview.duration_sec}s → ${preview.resolved_frames} frames (${preview.resolved_duration_sec}s actual)</div></div>
        <div class="setting"><label>Resolution</label><div class="val">${preview.resolution} @ ${preview.fps} fps</div></div>
        <div class="setting"><label>Aspect</label><div class="val">${preview.aspect}</div></div>
        <div class="setting"><label>Seed</label><div class="val">${preview.seed_policy}${preview.seed ? ' (' + preview.seed + ')' : ''}</div></div>
        <div class="setting"><label>Continuity</label><div class="val">${preview.continuity_mode}</div></div>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-title">Generate</div>
      <div class="gen-summary">
        <strong>Workflow:</strong> ${preview.workflow_id}<br>
        <strong>Duration:</strong> ${preview.resolved_duration_sec}s (${preview.resolved_frames} frames)<br>
        <strong>Pictures:</strong> ${preview.pictures.length} (${preview.pictures.filter(p=>p.status!=='blocked').length} ready)<br>
        <strong>Seed:</strong> ${preview.seed_policy}
      </div>
      <div class="action-bar">
        <button class="btn btn-primary btn-generate" ${canGen ? '' : 'disabled'} onclick="generateTake('${shot.id}')">
          ${canGen ? 'Generate Take' : 'Blocked'}
        </button>
      </div>
      ${!canGen && preview.predecessor_shot_index !== null ? `<div style="font-size:11px;color:var(--red);margin-top:6px;text-align:center;">Approve Shot ${preview.predecessor_shot_index + 1} to unlock generation</div>` : ''}
    </div>
  `;
}

async function approveTake(takeId) {
  try {
    await api(`/takes/${takeId}/approve`, {method:'POST'});
    toast('Take approved');
    await loadShots();
    if (selectedShotId) await selectShot(selectedShotId);
  } catch(e) { toast(e.message, false); }
}
async function rejectTake(takeId) {
  try {
    await api(`/takes/${takeId}/reject`, {method:'POST'});
    toast('Take rejected');
    await loadShots();
    if (selectedShotId) await selectShot(selectedShotId);
  } catch(e) { toast(e.message, false); }
}
async function generateTake(shotId) {
  toast('Generating... this may take 5-30 minutes');
  try {
    const r = await api(`/shots/${shotId}/generate`, {method:'POST'});
    toast('Take generated');
    await loadShots();
    await selectShot(shotId);
  } catch(e) { toast('Generation failed: ' + e.message, false); }
}

loadProject();
</script>
</body>
</html>
