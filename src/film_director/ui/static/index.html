<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Film Director — Operator Console</title>
<style>
:root{--bg:#1a1a2e;--bg2:#16213e;--bg4:#1e1e3a;--text:#e0e0e0;--text2:#8890a8;--accent:#e94560;--green:#4ecca3;--yellow:#f0c040;--red:#e94560;--blue:#4ea8de;--border:#2a2a4a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13px}
.app{display:grid;grid-template-columns:260px 1fr 360px;height:100vh}
.sidebar{background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto}
.sidebar-header{padding:14px;border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:15px;font-weight:700}
.sidebar-header .sub{font-size:11px;color:var(--text2);margin-top:2px}
.project-selector{padding:8px}
.project-card{padding:8px 10px;margin-bottom:4px;border-radius:6px;cursor:pointer;border:1px solid transparent;font-size:12px}
.project-card:hover{background:rgba(255,255,255,0.04)}
.project-card.selected{border-color:var(--accent);background:rgba(233,69,96,0.06)}
.shot-list{list-style:none;padding:8px}
.shot-card{padding:8px 10px;margin-bottom:3px;border-radius:6px;cursor:pointer;border:1px solid transparent;display:flex;align-items:center;gap:8px}
.shot-card:hover{background:rgba(255,255,255,0.04)}
.shot-card.selected{border-color:var(--accent);background:rgba(233,69,96,0.06)}
.shot-num{font-size:10px;color:var(--text2);font-weight:700;min-width:36px}
.shot-action{font-size:11px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;padding:1px 6px;border-radius:10px;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px}
.badge-approved{background:rgba(78,204,163,0.15);color:var(--green)}.badge-succeeded{background:rgba(78,168,222,0.15);color:var(--blue)}.badge-pending,.badge-generating{background:rgba(240,192,64,0.15);color:var(--yellow)}.badge-rejected{background:rgba(233,69,96,0.15);color:var(--red)}.badge-empty{background:rgba(255,255,255,0.04);color:var(--text2)}.badge-blocked{background:rgba(233,69,96,0.1);color:var(--red)}.badge-available{background:rgba(78,204,163,0.15);color:var(--green)}.badge-operator_override{background:rgba(240,192,64,0.15);color:var(--yellow)}.badge-generated{background:rgba(255,255,255,0.04);color:var(--text2)}.badge-candidate{background:rgba(240,192,64,0.15);color:var(--yellow)}.badge-archived{background:rgba(255,255,255,0.04);color:var(--text2)}.badge-current{background:rgba(78,204,163,0.15);color:var(--green)}.badge-stale{background:rgba(233,69,96,0.15);color:var(--red)}
.main{padding:16px 20px;overflow-y:auto}
.section{margin-bottom:14px}
.section-title{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:5px;padding-bottom:3px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.shot-title{font-size:16px;font-weight:700;margin-bottom:8px}
.meta-row{display:flex;gap:14px;margin-bottom:8px;flex-wrap:wrap}
.meta-label{font-size:9px;color:var(--text2);text-transform:uppercase}.meta-value{font-size:12px;margin-top:1px}
.desc-box{background:var(--bg4);padding:6px 8px;border-radius:6px;font-size:11px;line-height:1.4;max-height:60px;overflow-y:auto}
.prompt-area{width:100%;min-height:140px;padding:8px 10px;background:#111828;border:1px solid var(--border);border-radius:6px;font-size:11px;line-height:1.5;font-family:'Cascadia Code','Consolas',monospace;color:var(--text);resize:vertical}
.video-wrap{background:#000;border-radius:8px;overflow:hidden;max-width:680px;margin-bottom:8px}
.video-wrap video{width:100%;display:block}
.no-video{padding:32px;text-align:center;color:var(--text2);font-size:12px}
.take-row{display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:3px;background:var(--bg4);border-radius:6px}
.take-info{flex:1}.take-num{font-weight:700;font-size:12px}.take-meta{font-size:10px;color:var(--text2)}.take-actions{display:flex;gap:4px}
.panel{background:var(--bg2);border-left:1px solid var(--border);overflow-y:auto;padding:12px}
.panel-title{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:5px;margin-top:12px}.panel-title:first-child{margin-top:0}
.pic-card{display:flex;gap:6px;align-items:flex-start;padding:5px;margin-bottom:4px;background:var(--bg4);border-radius:6px;border:1px solid var(--border)}
.pic-card img{width:40px;height:40px;object-fit:cover;border-radius:3px;background:#111}
.pic-placeholder{width:40px;height:40px;border-radius:3px;background:#222;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text2)}
.pic-info{flex:1;min-width:0}.pic-num{font-size:8px;color:var(--text2);font-weight:700}.pic-role{font-size:10px;font-weight:600}.pic-ref{font-size:8px;color:var(--text2)}
.blocked-msg{background:rgba(233,69,96,0.08);border:1px solid rgba(233,69,96,0.2);border-radius:6px;padding:6px 8px;margin-bottom:6px}
.blocked-msg .msg{font-size:11px;color:var(--red);margin-bottom:3px}
.setting{margin-bottom:6px}
.setting label{display:block;font-size:9px;color:var(--text2);text-transform:uppercase;margin-bottom:1px}
.setting .val{font-size:11px;padding:3px 6px;background:rgba(255,255,255,0.03);border-radius:4px}
.setting input[type=number],.setting input[type=text],.setting textarea{width:100%;padding:4px 6px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:11px;font-family:inherit}
.setting select{width:100%;padding:4px 6px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:11px}
.resolved{font-size:10px;color:var(--green);margin-top:1px}
.gen-summary{background:var(--bg4);border-radius:6px;padding:6px 8px;margin-bottom:6px;font-size:10px;line-height:1.4}
.gen-summary strong{color:var(--text)}
.btn{padding:6px 12px;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer}.btn:hover{opacity:0.85}.btn:disabled{opacity:0.35;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff}.btn-approve{background:var(--green);color:#111}.btn-reject{background:#c0392b;color:#fff}.btn-sm{padding:3px 8px;font-size:10px}.btn-link{background:none;border:none;color:var(--blue);cursor:pointer;font-size:10px;text-decoration:underline;padding:0}
.btn-generate{width:100%;padding:10px;font-size:13px}
.loading{text-align:center;padding:24px;color:var(--text2)}
.toast{position:fixed;bottom:16px;right:16px;padding:8px 14px;border-radius:8px;font-size:11px;font-weight:600;z-index:100}.toast-ok{background:var(--green);color:#111}.toast-err{background:var(--red);color:#fff}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:50;display:flex;align-items:center;justify-content:center}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:20px;width:420px;max-width:90vw}
.modal h2{font-size:16px;margin-bottom:12px}
.modal .field{margin-bottom:10px}
.modal .field label{display:block;font-size:11px;color:var(--text2);margin-bottom:3px}
.modal .field input,.modal .field textarea{width:100%;padding:6px 8px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:12px;font-family:inherit}
.modal .field textarea{min-height:80px;resize:vertical}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.shot-edit-row{display:flex;gap:6px;margin-bottom:6px;align-items:flex-start}
.shot-edit-row textarea{flex:1;min-height:36px;padding:4px 6px;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:11px;resize:vertical}
.shot-edit-actions{display:flex;gap:3px;flex-shrink:0;padding-top:2px}
.ref-card{background:var(--bg4);border:1px solid var(--border);border-radius:6px;padding:6px;margin-bottom:4px}
.ref-card.ref-selected{border-color:var(--green)}
.ref-card-inner{display:flex;gap:6px;align-items:flex-start}
.ref-card img{width:72px;height:72px;object-fit:cover;border-radius:4px;background:#111;cursor:pointer}
.ref-card-info{flex:1;min-width:0}
.ref-card-meta{font-size:9px;color:var(--text2);margin-top:2px}
.ref-card-actions{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.ref-char-section{margin-bottom:10px}
.ref-char-name{font-size:11px;font-weight:700;margin-bottom:2px}
.ref-char-appearance{font-size:9px;color:var(--text2);margin-bottom:4px;max-height:28px;overflow:hidden}
.ref-char-actions{display:flex;gap:4px;margin-bottom:4px}
.idea-section{padding:8px;border-bottom:1px solid var(--border);background:rgba(233,69,96,0.04)}
.idea-label{font-size:9px;color:var(--accent);text-transform:uppercase;letter-spacing:0.5px;font-weight:700;margin-bottom:3px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.idea-text{font-size:11px;color:var(--text);line-height:1.5;max-height:80px;overflow-y:auto;transition:max-height 0.2s}
.idea-text.expanded{max-height:300px}
.prompt-preview{background:var(--bg4);border:1px solid var(--border);border-radius:6px;padding:6px 8px;margin:4px 0 6px}
.prompt-preview label{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:0.3px;display:flex;justify-content:space-between;align-items:center}
.prompt-preview textarea{width:100%;min-height:40px;padding:4px 6px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:3px;color:var(--text);font-size:10px;font-family:inherit;resize:vertical;margin-top:2px}
.prompt-details{margin-top:3px;padding:4px 6px;background:rgba(255,255,255,0.02);border-radius:3px;font-size:9px;color:var(--text2);line-height:1.4}
.prompt-details-toggle{font-size:9px;color:var(--blue);cursor:pointer;border:none;background:none;padding:0;text-decoration:underline}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-header"><h1>Film Director</h1><div class="sub" id="project-sub">Loading...</div></div>
    <div class="project-selector" id="project-selector"></div>
    <div id="idea-section" class="idea-section" style="display:none"></div>
    <ul class="shot-list" id="shot-list"></ul>
    <div id="scene-assembly" style="padding:8px;border-top:1px solid var(--border);margin-top:4px;"></div>
    <div style="padding:4px 8px;border-top:1px solid var(--border);margin-top:4px"><div class="panel-title" style="margin-top:0;display:flex;justify-content:space-between;align-items:center">Activity Log<button class="btn-link" style="font-size:8px" onclick="eventLog=[];renderEventLog()">clear</button></div><div id="event-log" style="max-height:140px;overflow-y:auto"></div></div>
    <div id="system-bar" style="padding:8px;border-top:1px solid var(--border);margin-top:auto;font-size:10px;"></div>
  </div>
  <div class="main" id="main-panel"><div class="loading">Select a project</div></div>
  <div class="panel" id="panel"><div class="loading">Select a shot</div></div>
</div>
<div id="modal-container"></div>

<script>
let projects=[],currentProject=null,currentShots=[],selectedShotId=null,shotTakesCache={};
let draftPrompt=null,draftDuration=null,draftSeedMode='random',draftSeedValue=null;
let refGenerating=false; // prevents duplicate ref generation
let activeJobPollers={}; // shot_id → {intervalId, jobId}

// Event log — recent operator-visible events
let eventLog=[];
const MAX_LOG=30;
function logEvent(op,status,msg){
  eventLog.unshift({time:new Date().toLocaleTimeString(),op,status,msg:msg||''});
  if(eventLog.length>MAX_LOG)eventLog.length=MAX_LOG;
  renderEventLog();
  // Also show toast for key events
  if(status==='error')toast(msg,false);
  else if(status==='success')toast(msg,true);
  else if(status==='running')toast(msg,true);
}
function renderEventLog(){
  const el=document.getElementById('event-log');
  if(!el)return;
  el.innerHTML=eventLog.map(e=>{
    const c=e.status==='error'?'var(--red)':e.status==='success'?'var(--green)':e.status==='running'?'var(--yellow)':'var(--text2)';
    return `<div style="font-size:10px;padding:2px 0;border-bottom:1px solid var(--border)"><span style="color:var(--text2)">${esc(e.time)}</span> <span style="color:${c};font-weight:600">${esc(e.status)}</span> <span style="color:var(--text2)">${esc(e.op)}</span><div style="color:var(--text);font-size:9px;word-break:break-all">${esc(e.msg)}</div></div>`;
  }).join('');
}

async function api(p,o){const r=await fetch(p,o);if(!r.ok){const e=await r.json().catch(()=>({error:r.statusText}));throw new Error(e.error||e.detail||r.statusText)}return r.json()}
function toast(m,ok=true){const e=document.createElement('div');e.className='toast '+(ok?'toast-ok':'toast-err');e.textContent=m;document.body.appendChild(e);setTimeout(()=>{e.style.opacity='0';setTimeout(()=>e.remove(),300)},3000)}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function sourceStateLabel(s){return s==='current'?'Fresh':s==='stale'?'Outdated':s}

async function init(){
  projects=await api('/projects');
  renderProjects();
  if(!projects.length)return;
  // Restore persisted selection or fall back to first project
  const storedPid=localStorage.getItem('film_director.selected_project_id');
  const target=storedPid&&projects.find(p=>p.id===storedPid)?storedPid:projects[0].id;
  await selectProject(target);
  // Restore persisted shot if applicable
  const storedSid=localStorage.getItem('film_director.selected_shot_id');
  if(storedSid&&currentShots.find(s=>s.id===storedSid)){
    await selectShot(storedSid);
  }
}

function renderProjects(){
  const el=document.getElementById('project-selector');
  el.innerHTML=`<button class="btn btn-primary" style="width:100%;margin-bottom:6px;font-size:11px;padding:7px" onclick="showNewProject()">+ New Project</button>`
    +projects.map(p=>`<div class="project-card${currentProject&&currentProject.id===p.id?' selected':''}" onclick="selectProject('${p.id}')">${esc((p.title||p.id).substring(0,35))}</div>`).join('');
}

function renderIdeaSection(){
  const el=document.getElementById('idea-section');
  if(!currentProject){el.style.display='none';return}
  const dc=currentProject.director_context||{};
  const originalIdea=dc.original_idea||'';
  const importedDesc=dc.description||'';
  if(!originalIdea&&!importedDesc){el.style.display='none';return}
  el.style.display='';
  const isExpanded=el.dataset.expanded==='1';
  if(originalIdea){
    el.innerHTML=`<div class="idea-label" onclick="toggleIdea()">Original Idea <span style="font-size:8px;color:var(--text2)">${isExpanded?'collapse':'expand'}</span></div><div class="idea-text${isExpanded?' expanded':''}">${esc(originalIdea)}</div><button class="btn-link" style="font-size:8px;margin-top:2px" onclick="showIdeaModal('Original Idea',${JSON.stringify(JSON.stringify(originalIdea))})">View Full</button>`;
  }else{
    el.innerHTML=`<div class="idea-label" onclick="toggleIdea()">Imported Description <span style="font-size:8px;color:var(--text2)">legacy project</span></div><div class="idea-text${isExpanded?' expanded':''}" style="opacity:0.7">${esc(importedDesc)}</div><button class="btn-link" style="font-size:8px;margin-top:2px" onclick="showIdeaModal('Imported Description',${JSON.stringify(JSON.stringify(importedDesc))})">View Full</button>`;
  }
}
function toggleIdea(){
  const el=document.getElementById('idea-section');
  el.dataset.expanded=el.dataset.expanded==='1'?'0':'1';
  renderIdeaSection();
}
function showIdeaModal(title,text){
  document.getElementById('modal-container').innerHTML=`
    <div class="modal-overlay" onclick="closeModal()">
      <div class="modal" onclick="event.stopPropagation()" style="width:600px">
        <h2>${esc(title)}</h2>
        <div style="white-space:pre-wrap;font-size:12px;line-height:1.6;max-height:60vh;overflow-y:auto;padding:8px;background:var(--bg4);border-radius:6px">${esc(text)}</div>
        <div class="actions"><button class="btn" onclick="closeModal()">Close</button></div>
      </div>
    </div>`;
}

async function selectProject(pid){
  currentProject=projects.find(p=>p.id===pid)||await api(`/projects/${pid}`);
  _projectChars=null; // reset character cache for subject picker
  localStorage.setItem('film_director.selected_project_id',currentProject.id);
  document.getElementById('project-sub').textContent=currentProject.id;
  renderProjects();renderIdeaSection();
  await loadShots();
  if(currentShots.length){await selectShot(currentShots[0].id)}
  else{document.getElementById('main-panel').innerHTML='<div class="loading">No shots yet. Use shot plan editor.</div>';showShotPlanEditor()}
}

async function loadShots(){
  if(!currentProject)return;
  const shots=await api(`/projects/${currentProject.id}/shots`);
  shots.sort((a,b)=>a.order_index-b.order_index);
  currentShots=shots;shotTakesCache={};
  for(const s of shots){try{shotTakesCache[s.id]=await api(`/shots/${s.id}/takes`)}catch(e){shotTakesCache[s.id]=[]}}
  renderShotList();renderSceneAssembly();
}

function renderShotList(){
  const list=document.getElementById('shot-list');
  list.innerHTML='<div style="padding:4px 8px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:9px;color:var(--text2);text-transform:uppercase;font-weight:700">Shots</span><button class="btn-link" onclick="showShotPlanEditor()">Edit Plan</button></div>';
  for(const shot of currentShots){
    const takes=shotTakesCache[shot.id]||[];
    const ap=takes.find(t=>t.status==='approved');const rv=takes.find(t=>t.status==='succeeded');
    const isActive=!!activeJobPollers[shot.id];
    let badge='<span class="badge badge-empty">—</span>';
    if(isActive)badge='<span class="badge badge-generating">Generating</span>';
    else if(ap)badge='<span class="badge badge-approved">✓</span>';
    else if(rv)badge='<span class="badge badge-succeeded">Review</span>';
    const li=document.createElement('li');
    li.className='shot-card'+(shot.id===selectedShotId?' selected':'');
    li.innerHTML=`<span class="shot-num">Shot ${shot.order_index+1}</span><span class="shot-action">${esc((shot.action||'').substring(0,40))}</span>${badge}`;
    li.onclick=()=>selectShot(shot.id);
    list.appendChild(li);
  }
}

async function selectShot(shotId){
  selectedShotId=shotId;draftPrompt=null;draftDuration=null;draftSeedMode='random';draftSeedValue=null;
  localStorage.setItem('film_director.selected_shot_id',shotId);
  renderShotList();
  // Ensure characters loaded for subject name resolution
  if(!_projectChars&&currentProject){
    try{_projectChars=await api(`/projects/${currentProject.id}/characters`)}catch(e){_projectChars=[]}
  }
  // Rediscover active generation on page refresh / shot switch
  if(!activeJobPollers[shotId])await checkActiveJobs(shotId);
  await refreshPreview();
}

async function refreshPreview(){
  if(!selectedShotId)return;
  const shot=currentShots.find(s=>s.id===selectedShotId);if(!shot)return;
  const params=new URLSearchParams();
  if(draftPrompt!==null)params.set('prompt_override',draftPrompt);
  if(draftDuration!==null)params.set('duration_sec',draftDuration);
  if(draftSeedMode==='explicit'&&draftSeedValue!==null)params.set('seed',draftSeedValue);
  let preview=null;
  try{preview=await api(`/shots/${selectedShotId}/generation-preview?${params}`)}catch(e){}
  renderMain(shot,preview);renderPanel(shot,preview);
}

let _projectChars=null; // cached for subject picker

function renderMain(shot,preview){
  const panel=document.getElementById('main-panel');
  const takes=shotTakesCache[shot.id]||[];const idx=currentShots.indexOf(shot);
  let cam={};try{cam=typeof shot.camera==='string'?JSON.parse(shot.camera):(shot.camera||{})}catch(e){}
  const ap=takes.find(t=>t.status==='approved');const rv=takes.filter(t=>t.status==='succeeded');
  const showTake=ap||rv[rv.length-1]||takes[takes.length-1];
  let videoHtml='<div class="no-video">No takes generated</div>';
  if(showTake&&showTake.video_path)videoHtml=`<video controls autoplay loop muted><source src="/media/${showTake.video_path.replace(/\\\\/g,'/')}" type="video/mp4"></video>`;

  // Subject names — resolve current canonical name by character_id
  const subjects=shot.subjects||[];
  const subjectHtml=subjects.map((s,i)=>{
    const ch=(_projectChars||[]).find(c=>c.id===s.character_id);
    const displayName=ch?ch.name:s.name;
    return `<span class="badge badge-available" style="margin-right:2px;display:inline-flex;align-items:center;gap:3px">${esc(displayName)}<button style="background:none;border:none;color:var(--red);cursor:pointer;font-size:10px;padding:0 1px;line-height:1" onclick="removeSubject('${shot.id}','${s.character_id}')" title="Remove ${esc(displayName)}">x</button></span>`;
  }).join('')||'<span style="color:var(--text2);font-size:10px">None</span>';

  // Audio intent
  const ai=shot.audio_intent||{};
  const lighting=shot.lighting||{};
  const env=shot.environment||{};

  // Prompt
  const promptVal=draftPrompt!==null?draftPrompt:(preview?preview.prompt_text:'');
  const isOverride=draftPrompt!==null;
  const promptSrc=isOverride?'operator_override':(preview?preview.prompt_source:'generated');

  // Shot size options
  const sizes=['extreme_wide','wide','medium_wide','medium','medium_close','close_up','extreme_close'];
  const sizeOpts=sizes.map(s=>`<option value="${s}" ${cam.shot_size===s?'selected':''}>${s.replace(/_/g,' ')}</option>`).join('');

  panel.innerHTML=`
    <div class="shot-title">Shot ${idx+1} — Production Editor</div>

    <div class="section"><div class="section-title">Video</div><div class="video-wrap">${videoHtml}</div></div>

    <div class="section"><div class="section-title">Shot Inputs</div>

async function _populateCharPicker(shot){
  if(!currentProject)return;
  if(!_projectChars){
    try{_projectChars=await api(`/projects/${currentProject.id}/characters`)}catch(e){_projectChars=[]}
  }
  const sel=document.getElementById('ed-add-char');
  if(!sel)return;
  const existing=new Set((shot.subjects||[]).map(s=>s.character_id));
  for(const ch of _projectChars){
    if(!existing.has(ch.id)){
      const opt=document.createElement('option');
      opt.value=ch.id;opt.textContent=ch.name;
      sel.appendChild(opt);
    }
  }
}

async function saveShot(shotId){
  const body={};
  const actionEl=document.getElementById('ed-action');
  if(actionEl)body.action=actionEl.value;
  const purposeEl=document.getElementById('ed-purpose');
  if(purposeEl)body.dramatic_purpose=purposeEl.value;
  const camSize=document.getElementById('ed-cam-size');
  const camAngle=document.getElementById('ed-cam-angle');
  const camMove=document.getElementById('ed-cam-move');
  if(camSize)body.camera={shot_size:camSize.value,angle:camAngle?camAngle.value:'',movement:camMove?camMove.value:''};
  const durEl=document.getElementById('ed-duration');
  if(durEl)body.duration_sec=parseFloat(durEl.value)||5.0;

  // Lighting: parse "key:val, key:val" into dict
  const lightEl=document.getElementById('ed-lighting');
  if(lightEl&&lightEl.value.trim()){
    const ld={};lightEl.value.split(',').forEach(p=>{const [k,...v]=p.split(':');if(k&&v.length)ld[k.trim()]=v.join(':').trim()});
    body.lighting=ld;
  }else{body.lighting={}}

  // Audio intent
  const ambEl=document.getElementById('ed-audio-ambient');
  const musEl=document.getElementById('ed-audio-music');
  const ai={};
  if(ambEl&&ambEl.value.trim())ai.ambient=ambEl.value.trim();
  if(musEl&&musEl.value.trim())ai.music=musEl.value.trim();
  body.audio_intent=ai;

  try{
    await api(`/shots/${shotId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    toast('Shot saved');
    draftPrompt=null; // Reset override so new generated prompt shows
    await loadShots();await selectShot(shotId);
  }catch(e){toast('Save failed: '+e.message,false)}
}

async function addSubjectFromPicker(shotId){
  const sel=document.getElementById('ed-add-char');
  if(!sel||!sel.value)return;
  const charId=sel.value;
  const char=(_projectChars||[]).find(c=>c.id===charId);
  if(!char)return;
  const shot=currentShots.find(s=>s.id===shotId);
  if(!shot)return;
  const subjects=[...(shot.subjects||[])];
  if(subjects.some(s=>s.character_id===charId)){toast('Character already in shot',false);return}
  subjects.push({character_id:charId,name:char.name,ref_images:[]});
  try{
    await api(`/shots/${shotId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({subjects})});
    toast(`Added ${char.name}`);
    draftPrompt=null;
    await loadShots();await selectShot(shotId);
  }catch(e){toast(e.message,false)}
}

async function removeSubject(shotId,charId){
  const shot=currentShots.find(s=>s.id===shotId);
  if(!shot||!shot.subjects)return;
  const subjects=shot.subjects.filter(s=>s.character_id!==charId);
  try{
    await api(`/shots/${shotId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({subjects})});
    toast('Subject removed');
    draftPrompt=null;
    await loadShots();await selectShot(shotId);
  }catch(e){toast(e.message,false)}
}

async function addShot(){
  if(!currentProject)return;
  const scenes=await api(`/projects/${currentProject.id}/scenes`);
  if(!scenes.length){toast('No scenes in project',false);return}
  try{
    await api(`/projects/${currentProject.id}/shots`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({scene_id:scenes[0].id,action:'New shot',duration_sec:5.0})});
    toast('Shot added');await loadShots();showShotPlanEditor();
  }catch(e){toast(e.message,false)}
}

async function editShot(shotId,field,value){
  try{
    const body={};body[field]=value;
    await api(`/shots/${shotId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    await loadShots();
  }catch(e){toast('Edit failed: '+e.message,false)}
}

async function moveShot(shotId,dir){
  const idx=currentShots.findIndex(s=>s.id===shotId);
  if(idx<0)return;
  const ids=[...currentShots.map(s=>s.id)];
  const swap=idx+dir;if(swap<0||swap>=ids.length)return;
  [ids[idx],ids[swap]]=[ids[swap],ids[idx]];
  try{
    await api(`/projects/${currentProject.id}/reorder-shots`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({shot_ids:ids})});
    await loadShots();showShotPlanEditor();
  }catch(e){toast(e.message,false)}
}

async function deleteShot(shotId){
  if(!confirm('Delete this shot?'))return;
  try{
    await api(`/shots/${shotId}`,{method:'DELETE'});
    toast('Shot deleted');await loadShots();showShotPlanEditor();
  }catch(e){toast(e.message,false)}
}

async function replanProject(){
  if(!currentProject)return;
  if(!confirm('Replace the current shot plan? This cannot be undone if Takes exist.'))return;
  const pid=currentProject.id;
  logEvent('replan','running',`Replanning ${pid}...`);
  try{
    const r=await api(`/projects/${pid}/replan`,{method:'POST'});
    logEvent('replan','success',`${pid}: ${r.beats_created} beats, ${r.shots_created} shots, ${r.plans_created} plans`);
    await loadShots();showShotPlanEditor();
  }catch(e){logEvent('replan','error',`${pid}: ${e.message}`)}
}

async function enrichProject(){
  if(!currentProject)return;
  const pid=currentProject.id;
  logEvent('enrich','running',`Enriching ${pid}...`);

async function toggleTakeDetails(takeId){
  const el=document.getElementById('take-details-'+takeId);
  if(!el)return;
  if(el.style.display!=='none'){el.style.display='none';return}
  el.style.display='';
  el.innerHTML='<div class="prompt-details">Loading generation details...</div>';
  try{
    const d=await api(`/takes/${takeId}/generation-details`);
    if(!d.available){el.innerHTML='<div class="prompt-details" style="color:var(--text2)">Generation details unavailable for this Take.</div>';return}

    // Prompt section

    html+=`<div style="white-space:pre-wrap;max-height:140px;overflow-y:auto;margin-bottom:6px;background:rgba(0,0,0,0.2);padding:4px 6px;border-radius:3px;font-size:10px;line-height:1.4">${esc(promptPreview)}</div>`;

    // Generation metadata
    html+=`<div style="font-weight:700;margin-bottom:4px;color:var(--text)">Generation</div>`;
    html+=`<div>Seed: ${d.seed}</div>`;
    html+=`<div>Workflow: ${esc(d.workflow_id||'?')} v${esc(d.workflow_version||'?')}</div>`;

    if(d.completed_at)html+=`<div>Completed: ${new Date(d.completed_at).toLocaleString()}</div>`;

    // Input references
    if(d.reference_snapshot&&d.reference_snapshot.length){
      html+=`<div style="font-weight:700;margin-top:6px;margin-bottom:4px;color:var(--text)">Input References</div>`;
      for(const r of d.reference_snapshot){
        const role=r.reference_kind==='character_body'?`Character: ${r.character_name||'?'}`:r.reference_kind==='environment'?'Environment':r.reference_kind==='continuity_frame'?'Continuity Frame':r.reference_kind;
        html+=`<div>Pic ${r.picture_index||'?'}: ${esc(role)}`;
        if(r.reference_asset_id)html+=` <span style="color:var(--text2)">(${r.reference_asset_id.substring(0,14)})</span>`;
        html+=`</div>`;
      }
    }

    // Continuity
    if(d.continuity_snapshot){
      const cs=d.continuity_snapshot;
      html+=`<div style="font-weight:700;margin-top:6px;margin-bottom:4px;color:var(--text)">Continuity</div>`;
      html+=`<div>From: Shot ${cs.upstream_shot_id?cs.upstream_shot_id.substring(0,14):'?'} / Take ${cs.upstream_take_id?cs.upstream_take_id.substring(0,14):'?'}</div>`;
    }

    html+=`</div>`;
    el.innerHTML=html;
  }catch(e){
    el.innerHTML='<div class="prompt-details" style="color:var(--text2)">Generation details unavailable.</div>';
  }
}
async function doGenerate(sid){
  const body={};
  if(draftPrompt!==null)body.prompt_override=draftPrompt;
  if(draftDuration!==null)body.duration_sec=draftDuration;
  if(draftSeedMode==='explicit'&&draftSeedValue!==null)body.seed=draftSeedValue;
  logEvent('generate','running',`Queuing generation for ${sid.substring(0,12)}...`);
  try{
    const r=await api(`/shots/${sid}/generate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    logEvent('generate','running',`Job ${r.job_id.substring(0,12)} queued (seed=${r.seed})`);
    startJobPoller(sid,r.job_id);
    if(selectedShotId===sid)refreshPreview();
  }catch(e){logEvent('generate','error',e.message)}
}
function startJobPoller(shotId,jobId){
  stopJobPoller(shotId);
  const poll=async()=>{
    try{
      const j=await api(`/queue/jobs/${jobId}`);
      if(j.status==='succeeded'){
        stopJobPoller(shotId);
        logEvent('generate','success',`Take ready (job ${jobId.substring(0,12)})`);
        await loadShots();if(selectedShotId===shotId)await selectShot(shotId);
      }else if(j.status==='failed'){
        stopJobPoller(shotId);
        logEvent('generate','error',j.error||'Generation failed');
        if(selectedShotId===shotId)refreshPreview();
      }else{
        // still pending/claimed — update shot list badge
        renderShotList();
      }
    }catch(e){/* ignore transient fetch errors */}
  };
  activeJobPollers[shotId]={intervalId:setInterval(poll,4000),jobId};
  renderShotList();
}
function stopJobPoller(shotId){
  if(activeJobPollers[shotId]){clearInterval(activeJobPollers[shotId].intervalId);delete activeJobPollers[shotId]}
}
async function checkActiveJobs(shotId){
  try{
    const jobs=await api(`/queue/jobs?shot_id=${shotId}`);
    const active=jobs.filter(j=>j.status==='pending'||j.status==='claimed');
    if(active.length>0){startJobPoller(shotId,active[0].id);return true}
  }catch(e){/* queue endpoint may not exist in tests */}
  return false;
}

async function showReferenceManager(){
  if(!currentProject)return;
  const panel=document.getElementById('main-panel');
  panel.innerHTML='<div class="loading">Loading references...</div>';
  try{
    const [chars,refs,proj]=await Promise.all([
      api(`/projects/${currentProject.id}/characters`),
      api(`/projects/${currentProject.id}/references`),
      api(`/projects/${currentProject.id}`),
    ]);
    renderReferenceManager(chars,refs,proj);
  }catch(e){panel.innerHTML=`<div class="loading">Error: ${esc(e.message)}</div>`}
}

function renderReferenceManager(chars,refs,proj){
  const panel=document.getElementById('main-panel');
  let html=`<div class="shot-title">Reference Manager</div>`;

  // Character references section
  html+=`<div class="section"><div class="section-title">Character References</div>`;
  if(!chars.length){
    html+=`<div style="color:var(--text2);font-size:11px;padding:8px">No characters in project.</div>`;
  }
  for(const ch of chars){
    const charRefs=refs.filter(r=>r.character_id===ch.id);
    const bodyRefs=charRefs.filter(r=>r.kind==='character_body');
    const faceRefs=charRefs.filter(r=>r.kind==='character_face');
    const hasApprovedBody=bodyRefs.some(r=>r.status==='approved'&&r.source_state==='current');
    html+=`<div class="ref-char-section">`;
    html+=`<div style="display:flex;gap:4px;align-items:center;margin-bottom:3px">${hasApprovedBody?'<span class="badge badge-approved">Ready</span>':'<span class="badge badge-empty">Needs ref</span>'}</div>`;
    html+=`<div class="setting"><label>Display Name</label><input type="text" id="char-name-${ch.id}" value="${esc(ch.name)}" style="font-weight:700"></div>`;
    html+=`<div class="setting"><label>Appearance</label><textarea id="char-app-${ch.id}" style="min-height:48px;font-size:10px">${esc(ch.appearance||'')}</textarea></div>`;
    html+=`<div class="ref-char-actions">`;
    html+=`<button class="btn btn-sm" onclick="saveCharDef('${ch.id}')">Save</button>`;
    html+=`<button class="btn btn-primary btn-sm" ${refGenerating||!ch.appearance?'disabled':''} onclick="toggleRefPrompt('char-prompt-${ch.id}','character_body','${ch.id}')">Review Body Prompt</button>`;
    html+=`<button class="btn btn-sm" ${refGenerating||!ch.appearance?'disabled':''} onclick="toggleRefPrompt('char-prompt-${ch.id}','character_face','${ch.id}')">Review Face Prompt</button>`;
    html+=`<label class="btn btn-sm" style="cursor:pointer"><input type="file" accept="image/*" style="display:none" onchange="uploadRef('${ch.id}','character_body',this)">Upload Body</label>`;
    html+=`</div>`;
    html+=`<div id="char-prompt-${ch.id}" style="display:none"></div>`;

    const allCharRefs=[...bodyRefs,...faceRefs];
    for(const ref of allCharRefs){
      html+=renderRefCard(ref);
    }
    if(!allCharRefs.length){
      html+=`<div style="color:var(--text2);font-size:10px;padding:4px 0">No references yet.</div>`;
    }
    html+=`</div>`;
  }
  html+=`</div>`;

  // Environment references section
  const envRefs=refs.filter(r=>r.kind==='environment');
  const hasApprovedEnv=envRefs.some(r=>r.status==='approved'&&r.source_state==='current');
  const envDesc=(proj&&proj.director_context&&proj.director_context.environment_description)||'';
  html+=`<div class="section"><div class="section-title">Environment Reference ${hasApprovedEnv?'<span class="badge badge-approved">Ready</span>':'<span class="badge badge-empty">Required</span>'}</div>`;
  html+=`<div class="setting"><label>Environment Description</label><textarea id="env-desc-edit" style="min-height:60px;font-size:10px">${esc(envDesc)}</textarea></div>`;
  if(!envDesc){
    html+=`<div style="font-size:10px;color:var(--yellow);margin-bottom:4px">No environment description. Click "Enrich Missing Data" or write one manually.</div>`;
  }
  html+=`<div class="ref-char-actions" style="margin-bottom:6px">`;
  html+=`<button class="btn btn-sm" onclick="saveEnvDesc()">Save</button>`;
  html+=`<button class="btn btn-primary btn-sm" ${refGenerating||!envDesc?'disabled':''} onclick="toggleEnvRefPrompt()">Review Env Prompt</button>`;
  html+=`<label class="btn btn-sm" style="cursor:pointer"><input type="file" accept="image/*" style="display:none" onchange="uploadEnvRef(this)">Upload Image</label>`;
  html+=`</div>`;
  html+=`<div id="env-prompt-preview" style="display:none"></div>`;
  for(const ref of envRefs){
    html+=renderRefCard(ref);
  }
  if(!envRefs.length){
    html+=`<div style="color:var(--text2);font-size:10px;padding:4px 0">No environment references yet.</div>`;
  }
  html+=`</div>`;

  panel.innerHTML=html;
  showReadiness();
}

function renderRefCard(ref){
  const isSelected=ref.status==='approved'&&ref.source_state==='current';
  const isPinned=ref.pinned;
  let html=`<div class="ref-card ${isSelected?'ref-selected':''}">`;
  html+=`<div class="ref-card-inner">`;
  const refUrl='/media/'+ref.managed_path.replace(/\\\\/g,'/').replace(/\\/g,'/');
  html+=`<img src="${refUrl}" onclick="previewRef('${refUrl}')" onerror="this.style.background='#333';this.alt='?'">`;
  html+=`<div class="ref-card-info">`;
  const kindLabel=ref.kind==='character_body'?'Body':ref.kind==='character_face'?'Face':ref.kind==='environment'?'Environment':ref.kind;
  const kindBadge=ref.kind==='character_body'?'available':ref.kind==='environment'?'available':'generated';
  html+=`<div><span class="badge badge-${kindBadge}">${kindLabel}</span> `;
  html+=`<span class="badge badge-${ref.status}">${ref.status}</span> `;
  html+=`<span class="badge badge-${ref.source_state}">${sourceStateLabel(ref.source_state)}</span>`;
  if(isPinned)html+=` <span class="badge badge-approved">Pinned</span>`;
  html+=`</div>`;
  html+=`<div class="ref-card-meta">${ref.source} · ${ref.width}x${ref.height} · ${ref.id.substring(0,12)}</div>`;
  html+=`<div class="ref-card-actions">`;
  // Lifecycle actions based on current status
  if(ref.status==='candidate'){
    html+=`<button class="btn btn-approve btn-sm" onclick="refAction('${ref.id}','approve')">Approve</button>`;
    html+=`<button class="btn btn-reject btn-sm" onclick="refAction('${ref.id}','reject')">Reject</button>`;
  }
  if(ref.status==='approved'){
    if(!isPinned)html+=`<button class="btn btn-sm" onclick="refAction('${ref.id}','pin')">Pin</button>`;
    if(isPinned)html+=`<button class="btn btn-sm" onclick="refAction('${ref.id}','unpin')">Unpin</button>`;
    html+=`<button class="btn btn-sm" onclick="refAction('${ref.id}','archive')">Archive</button>`;
  }
  if(ref.status==='rejected'){
    html+=`<button class="btn btn-sm" onclick="refAction('${ref.id}','approve')">Re-approve</button>`;
    html+=`<button class="btn btn-sm" onclick="refAction('${ref.id}','archive')">Archive</button>`;
  }
  html+=`</div></div>`;
  // Generation prompt details (P4.3)
  if(ref.source==='generated'&&ref.source_provenance){
    html+=`<div><button class="prompt-details-toggle" onclick="toggleRefDetails('${ref.id}','${ref.source_provenance}')">Generation Details</button><div id="ref-details-${ref.id}" style="display:none"></div></div>`;
  }else if(ref.source==='user_upload'){
    html+=`<div class="ref-card-meta" style="margin-top:3px">User upload</div>`;
  }
  html+=`</div>`;
  return html;
}

function previewRef(url){
  document.getElementById('modal-container').innerHTML=`
    <div class="modal-overlay" onclick="closeModal()">
      <div style="max-width:90vw;max-height:90vh;padding:8px"><img src="${url}" style="max-width:100%;max-height:88vh;border-radius:8px;box-shadow:0 4px 24px rgba(0,0,0,0.5)"></div>
    </div>`;

// --- Prompt preview and generation with overrides (P4.2) ---

let _activeRefPrompt=null; // tracks which prompt panel is open

async function toggleRefPrompt(containerId,kind,characterId){
  const el=document.getElementById(containerId);
  if(!el)return;
  if(el.style.display!=='none'&&el.dataset.kind===kind){
    el.style.display='none';_activeRefPrompt=null;return;
  }
  el.style.display='';
  el.dataset.kind=kind;
  _activeRefPrompt={containerId,kind,characterId};
  el.innerHTML='<div style="font-size:10px;color:var(--text2)">Loading prompt preview...</div>';
  try{
    const preview=await api(`/characters/${characterId}/reference-prompt-preview?kind=${kind}`);
    el.innerHTML=`<div class="prompt-preview">
      <label>Prompt <span class="badge badge-generated">Generated Default</span></label>
      <textarea id="ref-prompt-text-${containerId}">${esc(preview.prompt)}</textarea>
      <label style="margin-top:4px">Negative Prompt</label>
      <textarea id="ref-neg-text-${containerId}" style="min-height:28px">${esc(preview.negative_prompt)}</textarea>
      <div style="display:flex;gap:4px;margin-top:4px">
        <button class="btn btn-primary btn-sm" ${refGenerating?'disabled':''} onclick="doGenerateRef('${characterId}','${kind}','${containerId}')">Generate with this prompt</button>
        <button class="btn btn-sm" onclick="toggleRefPrompt('${containerId}','${kind}','${characterId}')">Cancel</button>
      </div>
    </div>`;
  }catch(e){el.innerHTML=`<div style="font-size:10px;color:var(--red)">${esc(e.message)}</div>`}
}

async function doGenerateRef(characterId,kind,containerId){
  if(refGenerating){toast('Generation already in progress',false);return}
  const promptEl=document.getElementById('ref-prompt-text-'+containerId);
  const negEl=document.getElementById('ref-neg-text-'+containerId);
  const body={kind};
  if(promptEl)body.prompt_override=promptEl.value;
  if(negEl)body.negative_prompt_override=negEl.value;
  refGenerating=true;
  logEvent('ref_generate','running',`Generating ${kind} for ${characterId.substring(0,12)}...`);
  try{
    await api(`/characters/${characterId}/references/generate`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body),
    });
    logEvent('ref_generate','success',`${kind} generated (candidate)`);
    try{await api('/system/free-memory',{method:'POST'})}catch(e){}
    _activeRefPrompt=null;
    await showReferenceManager();
  }catch(e){
    logEvent('ref_generate','error',e.message);
  }finally{
    refGenerating=false;
  }
}

async function toggleEnvRefPrompt(){

// --- Legacy compatibility wrappers (removed direct generate) ---

async function generateRef(characterId,kind){
  toggleRefPrompt('char-prompt-'+characterId,kind,characterId);
}

async function uploadRef(characterId,kind,input){
  if(!input.files||!input.files[0])return;
  const file=input.files[0];
  if(file.size>50*1024*1024){toast('File too large (max 50MB)',false);return}
  const formData=new FormData();
  formData.append('kind',kind);
  formData.append('file',file);
  toast('Uploading...');
  try{
    await fetch(`/characters/${characterId}/references/register`,{method:'POST',body:formData})
      .then(async r=>{if(!r.ok){const e=await r.json().catch(()=>({error:r.statusText}));throw new Error(e.error||e.detail||r.statusText)}return r.json()});
    toast('Reference uploaded (candidate)');
    await showReferenceManager();
  }catch(e){
    toast('Upload failed: '+e.message,false);
  }
  input.value='';
}

async function saveCharDef(charId){
  const nameEl=document.getElementById('char-name-'+charId);
  const appEl=document.getElementById('char-app-'+charId);
  if(!nameEl||!appEl)return;
  const name=nameEl.value.trim();
  const appearance=appEl.value.trim();
  if(!name){toast('Name cannot be empty',false);return}
  try{
    await api(`/characters/${charId}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,appearance})});
    logEvent('char_edit','success',`Saved ${charId.substring(0,12)}`);
    await showReferenceManager();
  }catch(e){logEvent('char_edit','error',e.message)}
}

async function saveEnvDesc(){
  if(!currentProject)return;
  const el=document.getElementById('env-desc-edit');
  if(!el)return;
  const desc=el.value.trim();
  try{
    await api(`/projects/${currentProject.id}/environment-description`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({environment_description:desc})});
    logEvent('env_edit','success','Environment description saved');
    await showReferenceManager();
  }catch(e){logEvent('env_edit','error',e.message)}
}

async function generateEnvRef(){

}

async function uploadEnvRef(input){

  if(file.size>50*1024*1024){toast('File too large (max 50MB)',false);return}

  try{
    await fetch(`/projects/${currentProject.id}/environment-references/register`,{method:'POST',body:formData})
      .then(async r=>{if(!r.ok){const e=await r.json().catch(()=>({error:r.statusText}));throw new Error(e.error||e.detail||r.statusText)}return r.json()});
    toast('Environment reference uploaded (candidate)');
    await showReferenceManager();
  }catch(e){
    toast('Upload failed: '+e.message,false);
  }
  input.value='';

// ===================================================================
// Activity + System polling
// ===================================================================
async function pollSystem(){
  try{
    const [act,sys]=await Promise.all([api('/activity'),api('/system/status')]);
    const bar=document.getElementById('system-bar');
    const gpu=sys.gpu||{};const oll=sys.ollama||{};
    let actHtml='';
    if(act.status==='running'){
      actHtml=`<div style="color:var(--yellow);font-weight:700">${esc(act.operation)} · ${esc(act.stage)}</div><div>${act.elapsed_seconds.toFixed(0)}s</div>`;
      if(act.stages_completed.length)actHtml+=`<div style="color:var(--green)">${act.stages_completed.join(' → ')} ✓</div>`;
    }else if(act.status==='failed'){
      actHtml=`<div style="color:var(--red)">FAILED: ${esc(act.error).substring(0,60)}</div><button class="btn-link" onclick="api('/activity/reset',{method:'POST'})">Dismiss</button>`;
    }else if(act.status==='complete'){
      actHtml=`<div style="color:var(--green)">${esc(act.detail).substring(0,50)} ✓</div>`;
    }
    bar.innerHTML=`${actHtml}<div style="margin-top:4px;color:var(--text2)">GPU: ${gpu.vram_used_gb||'?'}/${gpu.vram_total_gb||'?'}GB · Ollama: ${oll.status||'?'}</div><button class="btn-link" style="margin-top:2px" onclick="freeMemory()">Free memory</button>`;
  }catch(e){}
}
async function freeMemory(){try{const r=await api('/system/free-memory',{method:'POST'});toast('Memory freed')}catch(e){toast(e.message,false)}}
setInterval(pollSystem,2000);pollSystem();

        ${r.shot_count>0?`<button class="btn" style="width:100%;font-size:10px;color:var(--text2)" onclick="replanProject()">Regenerate Shot Plan</button>`:`<div style="font-size:9px;color:var(--text2);margin-top:2px">Click Enrich to create shot plan + character definitions.</div>`}
      </div>

  }catch(e){}
}
